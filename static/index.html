<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Churn Risk Checker</title>
<style>
:root{--bg:#fff;--fg:#1a1a1a;--mut:#666;--card:#f5f5f4;--bd:#ddd;--hi:#c0392b;--md:#d68910;--lo:#1e8449}
@media(prefers-color-scheme:dark){:root{--bg:#18181b;--fg:#f4f4f5;--mut:#a1a1aa;--card:#27272a;--bd:#3f3f46}}
body{font:15px/1.5 system-ui,sans-serif;background:var(--bg);color:var(--fg);max-width:760px;margin:0 auto;padding:16px}
h1{font-size:22px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
label{display:flex;flex-direction:column;font-size:12px;color:var(--mut);gap:3px}
input,select{padding:7px;border:1px solid var(--bd);border-radius:6px;background:var(--card);color:var(--fg)}
button{margin:14px 0;padding:10px 18px;border:0;border-radius:8px;background:#2563eb;color:#fff;font-size:15px;cursor:pointer}
#out{background:var(--card);border-radius:10px;padding:14px;display:none}
.big{font-size:34px;font-weight:700}.tag{display:inline-block;padding:2px 10px;border-radius:99px;color:#fff;font-size:13px}
li{margin:2px 0}.err{color:var(--hi)}
</style></head><body>
<h1>Customer Churn Risk Checker</h1>
<p style="color:var(--mut)">Real Telco data (7,043 customers) diye train kora model.</p>
<div class="grid" id="form"></div>
<button onclick="run()">Check risk</button>
<div id="out"></div>
<script>
const YN=["Yes","No"],ADD=["Yes","No","No internet service"];
const F=[["tenure","Tenure (months)","num",3],["monthly_charges","Monthly charges ($)","num",85],
["senior_citizen","Senior citizen",[0,1],0],["partner","Partner",YN,"No"],["dependents","Dependents",YN,"No"],
["phone_service","Phone service",YN,"Yes"],["multiple_lines","Multiple lines",["Yes","No","No phone service"],"No"],
["internet_service","Internet",["DSL","Fiber optic","No"],"Fiber optic"],["online_security","Online security",ADD,"No"],
["online_backup","Online backup",ADD,"No"],["device_protection","Device protection",ADD,"No"],["tech_support","Tech support",ADD,"No"],
["streaming_tv","Streaming TV",ADD,"Yes"],["streaming_movies","Streaming movies",ADD,"Yes"],
["contract","Contract",["Month-to-month","One year","Two year"],"Month-to-month"],["paperless_billing","Paperless billing",YN,"Yes"],
["payment_method","Payment",["Electronic check","Mailed check","Bank transfer (automatic)","Credit card (automatic)"],"Electronic check"]];
const form=document.getElementById("form");
F.forEach(([k,l,t,d])=>{const w=document.createElement("label");w.textContent=l;
 const el=t==="num"?Object.assign(document.createElement("input"),{type:"number",value:d,min:0}):
  Object.assign(document.createElement("select"),{innerHTML:t.map(o=>`<option ${o==d?"selected":""}>${o}</option>`).join("")});
 el.id=k;w.appendChild(el);form.appendChild(w)});
async function run(){
 const body={};F.forEach(([k,,t])=>{const v=document.getElementById(k).value;body[k]=(t==="num"||k==="senior_citizen")?Number(v):v});
 const out=document.getElementById("out");out.style.display="block";out.textContent="Checking...";
 try{const r=await fetch("/predict",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});
  if(!r.ok)throw new Error("Invalid input ("+r.status+")");const d=await r.json();
  const col={high:"var(--hi)",medium:"var(--md)",low:"var(--lo)"}[d.risk_tier];
  const li=a=>a.length?a.map(x=>`<li>${x.feature} = ${x.value} (${x.impact>0?"+":""}${x.impact})</li>`).join(""):"<li>none</li>";
  out.innerHTML=`<div class="big">${(d.churn_probability*100).toFixed(1)}% <span class="tag" style="background:${col}">${d.risk_tier}</span></div>
  <p>Action: <b>${d.recommended_action==="offer_retention"?"Send retention offer":"No action"}</b>
  (expected value $${d.expected_value_if_offer}, 12-month value $${d.customer_value_12m})</p>
  <b>Why risk is higher:</b><ul>${li(d.reasons.increases_risk)}</ul><b>What lowers risk:</b><ul>${li(d.reasons.reduces_risk)}</ul>`;
 }catch(e){out.innerHTML=`<span class="err">${e.message}</span>`}}
</script></body></html>
